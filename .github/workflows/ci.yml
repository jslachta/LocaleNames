name: CI

# Builds, tests and analyzes (Sonar) every push and pull request. A v* tag additionally publishes.
# Publishing a snapshot by hand is a separate workflow - see publish.yml.
on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit

  publish:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      # Goes to this repository's own GitHub Packages feed for now.
      # To switch to nuget.org: source https://api.nuget.org/v3/index.json,
      # api-key ${{ secrets.NUGET_API_KEY }}, and add "environment: nuget" with a required reviewer.
      # GitHub Packages has no symbol endpoint, so the .snupkg is attached to the release only.
      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "packages/*.nupkg"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --skip-duplicate

      - name: Create release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ github.ref_name }}"
          --repo "${{ github.repository }}"
          --title "${{ needs.build.outputs.version }}"
          --generate-notes
          ${{ needs.build.outputs.prerelease == 'true' && '--prerelease' || '' }}
          packages/*.nupkg
          packages/*.snupkg
