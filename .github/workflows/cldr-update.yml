name: CLDR update

# Once a week looks for a new major CLDR release (a tag of unicode-org/cldr-json). When there is one, it regenerates
# the data with PrepareData, builds and tests it, and opens a pull request. Minor and patch releases are left alone:
# for those, raise utils/LocaleNames.PrepareData/cldr-version.txt by hand and run PrepareData.
#
# Needs "Allow GitHub Actions to create and approve pull requests" (Settings > Actions > General). A pull request
# opened with GITHUB_TOKEN does not start CI; to get CI on it, add a fine-grained PAT (contents and pull requests:
# write) as the CLDR_UPDATE_TOKEN secret.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  DOTNET_NOLOGO: '1'
  VERSION_FILE: utils/LocaleNames.PrepareData/cldr-version.txt

jobs:
  update:
    name: Look for a new major CLDR release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare versions
        id: cldr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          CURRENT=$(tr -d '[:space:]' < "$VERSION_FILE")
          # releases/latest leaves out prereleases (betas of the next version)
          LATEST=$(gh api repos/unicode-org/cldr-json/releases/latest --jq .tag_name)

          echo "Current CLDR $CURRENT, latest release $LATEST"

          # the tag ends up in a file, a branch name and a URL, so anything but a plain version is refused
          if ! [[ "$LATEST" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected tag '$LATEST' of the latest cldr-json release."
            exit 1
          fi

          if (( ${LATEST%%.*} > ${CURRENT%%.*} )); then
            echo "update=true" >> "$GITHUB_OUTPUT"
          else
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "No new major version."
          fi

          echo "version=$LATEST"      >> "$GITHUB_OUTPUT"
          echo "major=${LATEST%%.*}"  >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        if: steps.cldr.outputs.update == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Prepare data
        if: steps.cldr.outputs.update == 'true'
        run: |
          echo "${{ steps.cldr.outputs.version }}" > "$VERSION_FILE"
          dotnet run --project utils/LocaleNames.PrepareData -c Release

      - name: Build
        if: steps.cldr.outputs.update == 'true'
        run: dotnet build LocaleNames.slnx -c Release

      - name: Test
        if: steps.cldr.outputs.update == 'true'
        run: |
          dotnet test tests/LocaleNames.Test/LocaleNames.Test.csproj -c Release --no-build
          dotnet test tests/LocaleNames.Data.Test/LocaleNames.Data.Test.csproj -c Release --no-build

      # One branch per major version: a later run (a newer patch release of it) updates the open pull request
      # instead of opening another one.
      - name: Create pull request
        if: steps.cldr.outputs.update == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.CLDR_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
          branch: feature/cldr-${{ steps.cldr.outputs.major }}
          add-paths: |
            ${{ env.VERSION_FILE }}
            src/LocaleNames.Data/Resources
          commit-message: 'FEATURE: CLDR ${{ steps.cldr.outputs.version }}'
          title: 'FEATURE: CLDR ${{ steps.cldr.outputs.version }}'
          body: |
            New major CLDR release [${{ steps.cldr.outputs.version }}](https://github.com/unicode-org/cldr-json/releases/tag/${{ steps.cldr.outputs.version }}), data regenerated by PrepareData. Built and tested by the CLDR update workflow.

            Release notes: https://cldr.unicode.org/downloads/cldr-${{ steps.cldr.outputs.major }}
          labels: cldr
          delete-branch: true
