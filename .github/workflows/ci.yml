name: CI

# Builds, tests and analyzes (Sonar) every push and pull request. A v* tag additionally publishes
# to GitHub Packages and nuget.org, and creates a GitHub release.
# Publishing a snapshot by hand is a separate workflow - see publish.yml.
on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit

  publish:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # Named in the nuget.org trusted publishing policy; a required reviewer on it gates the release.
    environment: nuget

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      # GitHub Packages has no symbol endpoint, so the .snupkg is attached to the release only.
      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "packages/*.nupkg"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --skip-duplicate

      # Trusted publishing: the OIDC token of this job is exchanged for an API key valid for 1 hour.
      # The nuget.org policy matches this repository, workflow file ci.yml and environment nuget.
      - name: Log in to nuget.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # The .snupkg next to each .nupkg is pushed to the nuget.org symbol server along with it.
      # --skip-duplicate lets a re-run of a partly failed release finish the remaining packages.
      - name: Push to nuget.org
        run: >
          dotnet nuget push "packages/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source "https://api.nuget.org/v3/index.json"
          --skip-duplicate

      - name: Create release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ github.ref_name }}"
          --repo "${{ github.repository }}"
          --title "${{ needs.build.outputs.version }}"
          --generate-notes
          ${{ needs.build.outputs.prerelease == 'true' && '--prerelease' || '' }}
          packages/*.nupkg
          packages/*.snupkg
